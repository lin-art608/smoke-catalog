<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香烟图鉴 · 126款</title>
<style>
:root{font:16px system-ui,"Microsoft YaHei",sans-serif;color:#ece5d6;background:#172622}*{box-sizing:border-box}body{margin:0}header{padding:48px max(24px,6vw) 24px;background:linear-gradient(120deg,#183b34,#192721)}small,.muted{color:#b6c7bd}h1{font-size:clamp(30px,5vw,58px);margin:12px 0}header p{max-width:760px;line-height:1.8}nav{position:sticky;top:0;z-index:2;background:#172622ee;backdrop-filter:blur(12px);padding:16px max(24px,6vw);display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #4b6256;border-radius:6px;background:#23382f;color:#eee6d4;padding:11px}input{flex:1;min-width:190px}button{cursor:pointer}main{padding:20px max(24px,6vw) 70px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#21332b;border:1px solid #3d5043;border-radius:10px;overflow:hidden}.art{height:310px;position:relative;background:radial-gradient(ellipse at bottom,#52726744,transparent 70%)}.portrait{width:100%;height:100%;object-fit:contain}.silhouette{filter:brightness(0)}.pack{position:absolute;bottom:12px;right:12px;width:86px;height:115px;object-fit:contain;background:#fff;border-radius:5px}.pack-only{width:100%;height:260px;object-fit:contain;padding:22px}.card button{display:block;width:100%;border:0;border-radius:0;background:transparent;text-align:left;padding:0}.copy{padding:16px}.copy h2{font-size:18px;margin:7px 0}.copy p{font-size:13px;line-height:1.6;color:#b8c9be}.count{margin-bottom:20px}dialog{background:#1d3128;color:#eee6d4;border:1px solid #596e5c;border-radius:12px;max-width:940px;width:92vw;padding:24px}dialog::backdrop{background:#000a}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}.detail img{width:100%;height:560px;object-fit:contain}.detail p{line-height:1.7;overflow-wrap:anywhere}a{color:#dec180}.close{float:right}@media(max-width:640px){header{padding-top:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:230px}.pack{width:62px;height:85px}.copy{padding:10px}.copy h2{font-size:15px}.detail{grid-template-columns:1fr}.detail img{height:410px}nav{gap:6px}select{max-width:145px}}
.map-panel{margin:0 auto 28px;max-width:850px}.china-svg{width:100%;height:auto}.map-shape{fill:#355247;stroke:#9cb09e;stroke-width:.7;cursor:pointer}.map-shape:hover,.map-shape:focus,.map-shape.active{fill:#c3a365;outline:none}.map-shape.empty{fill:#25372e}.map-note{font-size:13px;color:#b6c7bd}.map-points{display:none}input[type="checkbox"]{width:18px;height:18px;flex:none!important;accent-color:#c3a365;padding:0}</style></head><body><header><small>SMOKE ARCHIVE / CURRENT COLLECTION</small><h1>在售香烟图鉴</h1><p>100款主清单与地区补充，按品牌、地域与支型浏览。包装配色和纹样转译为独立原创角色，点击剪影揭示立绘。</p><small>按常见规格选品，未设全国销量名次。包装图为资料参考，部分版本与清晰度待补核验。</small></header><nav><input id="search" aria-label="搜索名称或条码" placeholder="搜索名称、规格或条码"><select id="brand" aria-label="品牌"><option value="">全部品牌</option></select><select id="region" aria-label="地域"><option value="">全部地域</option></select><select id="stick" aria-label="支型"><option value="">全部支型</option></select><label style="display:flex;align-items:center;gap:6px"><input id="portraitsOnly" type="checkbox" style="min-width:0;flex:0">只看已完成立绘</label><label style="display:flex;align-items:center;gap:6px"><input id="revealAll" type="checkbox" style="min-width:0;flex:0">显示原画</label><button id="refresh">更新进度</button></nav><main><details class="map-panel"><summary>按地图选择地域 · 34地区</summary><div id="chinaMap"></div><p class="map-note" id="mapSelection">点击地域筛选。无收录地区显示0款。</p><small>示意地图 · 数据来源 <a href="https://www.geoboundaries.org/">geoBoundaries</a></small></details><p class="count" id="count"></p><div class="grid" id="grid"></div></main><dialog id="detail"><button class="close" id="close">关闭 ×</button><div id="detailBody"></div></dialog><script src="map.js"></script><script src="current-catalog.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const [key,id] of [['brand','#brand'],['region','#region'],['stickType','#stick']])for(const v of [...new Set(key==='region'?currentRegions.map(x=>x.name):currentCatalog.map(x=>x[key]))].sort())$(id).insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
const mapRoot=$('#chinaMap');mapRoot.innerHTML=chinaMapSvg;mapRoot.querySelector('.china-svg').setAttribute('role','group');mapRoot.querySelector('.map-points')?.remove();mapRoot.querySelectorAll('[data-province]').forEach(e=>{e.classList.toggle('empty',!currentCatalog.some(x=>x.provinceId===e.dataset.province));e.setAttribute('aria-pressed','false');});function pickRegion(e){const target=e.target.closest('[data-province]');if(!target)return;const r=currentRegions.find(r=>r.id===target.dataset.province);if(!r)return;$('#region').value=r.name;render();}mapRoot.addEventListener('click',pickRegion);mapRoot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pickRegion(e);}});
$('#portraitsOnly').checked=new URLSearchParams(location.search).get('portraits')==='1';$('#revealAll').checked=$('#portraitsOnly').checked;
function render(){mapRoot.querySelectorAll('[data-province]').forEach(e=>{const active=currentRegions.find(r=>r.id===e.dataset.province)?.name===$('#region').value;e.classList.toggle('active',active);e.setAttribute('aria-pressed',String(active));});$('#mapSelection').textContent=$('#region').value?'当前地域：'+$('#region').value:'点击地域筛选。无收录地区显示0款。';const q=$('#search').value.toLowerCase(),rows=currentCatalog.filter(x=>(!$('#portraitsOnly').checked||x.portrait)&&(x.name+x.brand+x.region+(x.barcode||'')).toLowerCase().includes(q)&&(!$('#brand').value||x.brand===$('#brand').value)&&(!$('#region').value||x.region===$('#region').value)&&(!$('#stick').value||x.stickType===$('#stick').value));$('#count').textContent=`显示 ${rows.length} / ${currentCatalog.length} 款 · 已生成立绘 ${currentCatalog.filter(x=>x.portrait).length} / ${currentCatalog.length}`;
$('#grid').innerHTML=rows.map(x=>`<article class="card"><button data-id="${esc(x.id)}" aria-label="查看${esc(x.name)}"><div class="art">${x.portrait?`<img loading="lazy" decoding="async" class="portrait ${$('#revealAll').checked?'':'silhouette'}" src="${esc(x.portrait)}" alt="${esc(x.name)}角色剪影"><img loading="lazy" class="pack" src="${esc(x.pack)}" alt="${esc(x.name)}包装参考">`:`<img loading="lazy" class="pack-only" src="${esc(x.pack)}" alt="${esc(x.name)}包装参考">`}</div><div class="copy"><small>${esc(x.region)} · ${esc(x.stickType)}${x.collection==='regional-supplement'?' · 地区补充':''}</small><h2>${esc(x.name)}</h2><p>${esc(x.characterStatus)}</p></div></button></article>`).join('');}
for(const id of ['#search','#brand','#region','#stick','#portraitsOnly','#revealAll'])$(id).addEventListener('input',render);
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const x=currentCatalog.find(x=>x.id===b.dataset.id);$('#detailBody').innerHTML=`<div class="detail"><img src="${esc(x.portrait||x.pack)}" alt="${esc(x.name)}${x.portrait?'原创立绘':'包装参考'}"><div><small>${esc(x.region)} · ${esc(x.brand)}</small><h2>${esc(x.name)}</h2><p>${esc(x.boxType)} · ${esc(x.stickType)} · ${x.stickCount==='未列出'?'支数未列出':esc(x.stickCount)+'支'} · ${x.length==='未列出'?'烟长未列出':esc(x.length)}</p><p>包装小盒条码：${esc(x.barcode||'资料未列出')}<br><small>条码为来源声明，尚未实物认证。</small></p><p>图案与配色：${esc(x.visualBasis)}</p><p>${esc(x.characterStatus)}。角色为非官方原创设计。</p><img style="height:180px" src="${esc(x.pack)}" alt="${esc(x.name)}包装参考"><p><a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">查看规格资料</a> · 访问 ${esc(x.sourceDate)}</p><small>${esc(x.status)}。参考图不能作为高清实物认证。</small></div></div>`;$('#detail').showModal();});$('#close').onclick=()=>$('#detail').close();$('#refresh').onclick=()=>location.reload();render();
</script></body></html>
